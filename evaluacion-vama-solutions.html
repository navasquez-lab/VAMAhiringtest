<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de Candidatos — Vama Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0d2b45;
  --teal: #1a7a8a;
  --teal-light: #4ab0bf;
  --teal-pale: #e8f5f7;
  --teal-mid: #c5e8ed;
  --white: #ffffff;
  --gray-50: #f7f9fa;
  --gray-100: #eef1f3;
  --gray-200: #dde3e8;
  --gray-400: #8fa0ad;
  --gray-600: #4a6070;
  --gray-800: #1e3040;
  --success: #1a7a5a;
  --success-bg: #e6f5ef;
  --danger: #b33a2a;
  --danger-bg: #fcecea;
  --warning: #8a6200;
  --warning-bg: #fff8e6;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 1px 4px rgba(13,43,69,.07), 0 4px 16px rgba(13,43,69,.06);
  --shadow-lg: 0 4px 24px rgba(13,43,69,.10), 0 1px 4px rgba(13,43,69,.06);
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--gray-50);
  color: var(--navy);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Layout ── */
.page-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  background: var(--navy);
  display: flex;
  flex-direction: column;
  padding: 2rem 1.5rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  background: white;
  border-radius: var(--radius);
  padding: .75rem 1rem;
  margin-bottom: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-logo img {
  width: 100%;
  max-width: 180px;
  height: auto;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--teal-light);
  text-transform: uppercase;
  margin-bottom: 1.25rem;
}

.sidebar-modules {
  display: flex;
  flex-direction: column;
  gap: .4rem;
  flex: 1;
}

.mod-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: .6rem .75rem;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: rgba(255,255,255,.5);
  transition: all .2s;
  cursor: default;
}

.mod-item.active {
  background: rgba(74,176,191,.15);
  color: var(--teal-light);
  font-weight: 500;
}

.mod-item.done {
  color: rgba(255,255,255,.35);
}

.mod-item.done .mod-dot {
  background: var(--teal);
}

.mod-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  flex-shrink: 0;
}

.mod-item.active .mod-dot {
  background: var(--teal-light);
  box-shadow: 0 0 0 3px rgba(74,176,191,.25);
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 1.5rem;
  font-size: 12px;
  color: rgba(255,255,255,.3);
  line-height: 1.5;
}

/* ── Main content ── */
.main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.main-header {
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  padding: 1.25rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-meta {
  font-size: 13px;
  color: var(--gray-600);
}

.progress-outer {
  width: 200px;
  height: 6px;
  background: var(--gray-200);
  border-radius: 3px;
  overflow: hidden;
}

.progress-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--teal-light));
  border-radius: 3px;
  transition: width .4s ease;
}

.main-body {
  flex: 1;
  padding: 2.5rem;
  max-width: 780px;
}

/* ── Intake form ── */
.intake-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.intake-header {
  background: var(--navy);
  padding: 2rem 2.5rem;
  color: white;
}

.intake-header h1 {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: .4rem;
}

.intake-header p {
  font-size: 14px;
  opacity: .7;
  max-width: 480px;
}

.intake-body {
  padding: 2rem 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: .4rem;
}

.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-600);
  letter-spacing: .03em;
  text-transform: uppercase;
}

.field input, .field select {
  height: 42px;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 0 .875rem;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--navy);
  background: var(--white);
  outline: none;
  transition: border-color .15s;
}

.field input:focus, .field select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(26,122,138,.12);
}

.start-btn {
  align-self: flex-start;
  background: var(--teal);
  color: white;
  border: none;
  padding: .75rem 2rem;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background .15s, transform .1s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.start-btn:hover { background: var(--navy); }
.start-btn:active { transform: scale(.98); }

/* ── Question card ── */
.q-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 1.25rem;
}

.q-card-header {
  padding: 1.5rem 2rem;
  border-bottom: 1px solid var(--gray-100);
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.module-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}

.pill-emp { background: #ede9ff; color: #5b3ec2; }
.pill-cx  { background: var(--teal-pale); color: var(--teal); }
.pill-mem { background: #e6f5ef; color: #1a7a5a; }
.pill-ag  { background: #fcecea; color: #b33a2a; }
.pill-mt  { background: #fff3e6; color: #8a5200; }

.scenario-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-400);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: .4rem;
}

.scenario-box {
  background: var(--gray-50);
  border: 1px solid var(--gray-100);
  border-left: 3px solid var(--teal);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: .875rem 1rem;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--gray-600);
  margin-bottom: 1.25rem;
}

.q-card-body {
  padding: 1.5rem 2rem;
}

.q-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--navy);
  line-height: 1.6;
  margin-bottom: 1.25rem;
}

.options {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: .875rem 1rem;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
  text-align: left;
  color: var(--navy);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
  transition: border-color .15s, background .15s;
  width: 100%;
}

.opt-btn:hover { border-color: var(--teal); background: var(--teal-pale); }
.opt-btn.selected { border-color: var(--teal); background: var(--teal-pale); }
.opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); pointer-events: none; }
.opt-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); pointer-events: none; }
.opt-btn.neutral-reveal { border-color: var(--gray-200); pointer-events: none; opacity: .6; }

.opt-letter {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
  color: var(--gray-600);
}

.opt-btn.selected .opt-letter {
  background: var(--teal); color: white;
}
.opt-btn.correct .opt-letter { background: var(--success); color: white; }
.opt-btn.wrong .opt-letter { background: var(--danger); color: white; }

/* Memory grid */
.mem-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
  margin-bottom: 1rem;
}

.mem-item {
  background: var(--teal-pale);
  border: 1px solid var(--teal-mid);
  border-radius: var(--radius-sm);
  padding: .75rem .875rem;
  font-size: 13px;
}

.mem-item strong {
  display: block;
  font-weight: 600;
  font-size: 11px;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 2px;
}

.mem-item span { color: var(--navy); }

/* Rank */
.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: .75rem 1rem;
  background: var(--white);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  margin-bottom: .5rem;
  font-size: 14px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  user-select: none;
}

.rank-item:hover { border-color: var(--teal); }
.rank-item.selected-rank { border-color: var(--teal); background: var(--teal-pale); }

.rank-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  color: var(--gray-600);
  flex-shrink: 0;
}

.rank-item.selected-rank .rank-num {
  background: var(--teal); color: white;
}

/* Timer */
.timer-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--gray-100);
  color: var(--gray-600);
}

.timer-badge.warn { background: var(--warning-bg); color: var(--warning); }
.timer-badge.danger { background: var(--danger-bg); color: var(--danger); }

/* Feedback */
.feedback-box {
  margin-top: .875rem;
  padding: .875rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.6;
  border-left: 3px solid;
}
.feedback-ok { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.feedback-bad { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* Nav */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: .5rem;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: .65rem 1.25rem;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all .15s;
  border: 1.5px solid var(--gray-200);
  background: white;
  color: var(--navy);
}

.nav-btn:hover { background: var(--gray-50); border-color: var(--navy); }
.nav-btn:disabled { opacity: .35; cursor: not-allowed; }
.nav-btn.primary { background: var(--teal); border-color: var(--teal); color: white; }
.nav-btn.primary:hover { background: var(--navy); border-color: var(--navy); }

/* Submitting state */
.submitting-overlay {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 3rem 2.5rem;
  text-align: center;
}

.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--gray-200);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 1.25rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.submit-msg {
  font-size: 16px;
  font-weight: 500;
  color: var(--navy);
  margin-bottom: .4rem;
}

.submit-sub {
  font-size: 13px;
  color: var(--gray-400);
}

/* Done screen */
.done-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 3rem 2.5rem;
  text-align: center;
}

.done-icon {
  width: 64px; height: 64px;
  background: var(--teal-pale);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 28px;
}

.done-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: .5rem;
}

.done-sub {
  font-size: 14px;
  color: var(--gray-400);
  max-width: 380px;
  margin: 0 auto;
}

/* Hint */
.hint { font-size: 12px; color: var(--gray-400); margin-top: .4rem; }

/* Responsive */
@media (max-width: 900px) {
  .page-shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main-body { padding: 1.5rem; }
  .field-row { grid-template-columns: 1fr; }
  .mem-grid { grid-template-columns: 1fr; }
}
</style>
</head>

    q:'¿Cómo respondes en este momento?',

    opts:['Procedas directamente a cancelar las citas para no prolongar el momento difícil.','No se preocupe, hizo bien en llamar. Le damos el tiempo que necesite. Lamentamos mucho su pérdida. Cuando se sienta listo, con gusto le ayudamos con todo lo necesario.','Entendido. ¿Me puede confirmar el nombre completo y número de identificación de la paciente para proceder?','Le paso con el área de cancelaciones, yo solo manejo citas nuevas.'],
    correct:1,
    feedback:'Antes de cualquier procedimiento, hay que reconocer el momento humano. Pedir datos de inmediato o transferir sin más resulta frío e inapropiado.'
  },
  {
    module:'ag', label:'Agilidad mental',
    timed:true, timeLimit:30,
    scenario:'Recibes estos 3 mensajes al mismo tiempo:\n• Paciente A: cita de control de diabetes mañana a las 8 AM — lleva 2 días sin confirmación\n• Paciente B: alergia documentada a la penicilina — médico acaba de prescribirle amoxicilina (familia penicilinas)\n• Paciente C: cuidadora pregunta si puede cambiar cita de fisioterapia de la próxima semana',
    q:'¿Cuál caso requiere atención inmediata y por qué?',
    type:'mcq',
    opts:['Paciente A — la cita es mañana y puede perderse.','Paciente C — la cuidadora está esperando respuesta.','Paciente B — hay una prescripción que podría representar un riesgo de salud para el paciente.','Los tres son igual de urgentes y se atienden en orden de llegada.'],
    correct:2,
    feedback:'Un posible error de medicación con un alérgeno documentado es una alerta de seguridad clínica que debe escalar de inmediato. Supera en urgencia cualquier gestión administrativa.'
  },
  {
    module:'mem', label:'Retención de información',
    timed:false,
    scenario:'Durante una inducción tu supervisora explica: "Cuando un familiar llame por el estado de un paciente hospitalizado, verifiquen identidad con nombre completo y parentesco. Solo pueden dar estado general (estable, en observación) — nunca diagnóstico ni tratamiento. Si hay restricción de visita, no confirmar siquiera que está hospitalizado. Cualquier duda, escalar a enfermería."',
    q:'Llama alguien que dice ser el sobrino de un paciente. Pregunta: "¿Cómo está mi tío? ¿Qué le encontraron?" ¿Qué haces?',
    type:'mcq',
    opts:['Das el diagnóstico si el nombre que menciona coincide con el del paciente.','Verificas nombre completo y parentesco, informas solo el estado general (si aplica y no hay restricción), y explicas que el diagnóstico no puede compartirse por protocolo.','Dices que no puedes dar ningún tipo de información y cuelgas.','Le pides que venga en persona al hospital.'],
    correct:1,
    feedback:'Aplicar correctamente el protocolo de confidencialidad es crítico en salud. Se verifica identidad, se da solo estado general sin diagnóstico, y se explica el protocolo con respeto.'
  }
];

// ─── State ────────────────────────────────────────────────────────────────────
let state = {
  view: 'intake',
  candidate: {},
  cur: 0,
  answers: new Array(QUESTIONS.length).fill(null),
  revealed: new Array(QUESTIONS.length).fill(false),
  rankOrder: [],
  rankSelected: null,
  memPhase: 0,
  timerInterval: null,
  timeLeft: 0
};

// ─── Utilities ────────────────────────────────────────────────────────────────
function clearTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  document.getElementById('global-timer').style.display = 'none';
}

function startTimer(sec, onEnd) {
  state.timeLeft = sec;
  const badge = document.getElementById('global-timer');
  const txt = document.getElementById('timer-text');
  badge.style.display = 'inline-flex';
  const tick = () => {
    txt.textContent = state.timeLeft + 's';
    badge.className = 'timer-badge' + (state.timeLeft <= 5 ? ' danger' : state.timeLeft <= 10 ? ' warn' : '');
    if (state.timeLeft <= 0) { clearTimer(); onEnd(); return; }
    state.timeLeft--;
  };
  tick();
  state.timerInterval = setInterval(tick, 1000);
}

function updateProgress() {
  if (state.view === 'intake') { document.getElementById('progress-bar').style.width = '0%'; return; }
  const pct = Math.round((state.cur + 1) / QUESTIONS.length * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateSidebar() {
  const mods = ['intake','emp','mem','ag','cx','mt'];
  const curMod = state.view === 'intake' ? 'intake' : state.view === 'quiz' ? QUESTIONS[state.cur].module : 'done';
  mods.forEach(m => {
    const el = document.querySelector(`[data-mod="${m}"]`);
    if (!el) return;
    el.className = 'mod-item';
    if (m === curMod) el.classList.add('active');
    else if (state.view === 'quiz') {
      const idx = QUESTIONS.findIndex(q => q.module === m);
      if (idx !== -1 && idx < state.cur) el.classList.add('done');
    }
  });
}

function updateHeader() {
  const meta = document.getElementById('header-meta');
  if (state.view === 'intake') { meta.textContent = 'Evaluación de candidatos'; return; }
  if (state.view === 'quiz') {
    const q = QUESTIONS[state.cur];
    meta.textContent = `Pregunta ${state.cur + 1} de ${QUESTIONS.length} — ${q.label}`;
    return;
  }
  meta.textContent = 'Evaluación completada';
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  clearTimer();
  updateProgress();
  updateSidebar();
  updateHeader();
  const body = document.getElementById('main-body');
  if (state.view === 'intake') renderIntake(body);
  else if (state.view === 'quiz') renderQuiz(body);
  else if (state.view === 'submitting') renderSubmitting(body);
  else if (state.view === 'done') renderDone(body);
}

// ── Intake ─────────────────────────────────────────────────────────────────
function renderIntake(body) {
  body.innerHTML = `
  <div class="intake-card">
    <div class="intake-header">
      <h1>Evaluación de competencias — Atención en salud</h1>
      <p>Por favor completa los siguientes datos antes de comenzar. El test tomará aproximadamente 15 minutos.</p>
    </div>
    <div class="intake-body">
      <div class="field-row">
        <div class="field">
          <label>Nombre completo</label>
          <input type="text" id="f-name" placeholder="Ej. María Torres" autocomplete="off">
        </div>
        <div class="field">
          <label>Número de identificación</label>
          <input type="text" id="f-id" placeholder="CC / CE / Pasaporte">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Cargo al que aplica</label>
          <input type="text" id="f-role" placeholder="Ej. Agente de atención Tier 1">
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" id="f-date" value="${new Date().toISOString().split('T')[0]}">
        </div>
      </div>
      <div id="intake-error" style="font-size:13px;color:var(--danger);display:none">Por favor completa todos los campos antes de continuar.</div>
      <button class="start-btn" onclick="startQuiz()">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5,3 19,10 5,17"/></svg>
        Comenzar evaluación
      </button>
    </div>
  </div>`;
}

function startQuiz() {
  const name = document.getElementById('f-name').value.trim();
  const id   = document.getElementById('f-id').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const date = document.getElementById('f-date').value;
  const err  = document.getElementById('intake-error');
  if (!name || !id || !role || !date) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  state.candidate = { name, id, role, date };
  state.view = 'quiz';
  state.cur = 0;
  render();
}

// ── Quiz ──────────────────────────────────────────────────────────────────
function renderQuiz(body) {
  const q = QUESTIONS[state.cur];
  const isLast = state.cur === QUESTIONS.length - 1;
  let html = '';

  // Card header
  const pillClass = {emp:'pill-emp',cx:'pill-cx',mem:'pill-mem',ag:'pill-ag',mt:'pill-mt'}[q.module];
  html += `<div class="q-card"><div class="q-card-header" style="flex-wrap:wrap;gap:.5rem">
    <span class="module-pill ${pillClass}">${q.label}</span>
  </div><div class="q-card-body">`;

  // Scenario
  if (q.scenario) html += `<div class="scenario-label">Escenario</div><div class="scenario-box">${q.scenario.replace(/
/g,'<br>')}</div>`;

  if (q.type === 'memory') {
    html += renderMemoryInner(q);
  } else if (q.type === 'rank') {
    html += renderRankInner(q);
  } else {
    html += `<p class="q-text">${q.q}</p><div class="options">`;
    q.opts.forEach((o, i) => {
      let cls = 'opt-btn';
      const rev = state.revealed[state.cur];
      if (rev) {
        cls += i === q.correct ? ' correct' : state.answers[state.cur] === i ? ' wrong' : ' neutral-reveal';
      } else if (state.answers[state.cur] === i) cls += ' selected';
      const click = rev ? '' : `onclick="selectMCQ(${i})"`;
      html += `<button class="${cls}" ${click}>
        <span class="opt-letter">${LETTERS[i]}</span>
        <span>${o}</span>
      </button>`;
    });
    html += '</div>';
    if (state.revealed[state.cur]) {
      const ok = state.answers[state.cur] === q.correct;
      html += `<div class="feedback-box ${ok ? 'feedback-ok' : 'feedback-bad'}">${ok ? '✓ Correcto — ' : '✗ Respuesta correcta: ' + LETTERS[q.correct] + ' — '}<em>${q.feedback}</em></div>`;
    }
  }

  html += `</div></div>`;

  // Nav
  html += `<div class="nav-row">
    <button class="nav-btn" ${state.cur === 0 ? 'disabled' : ''} onclick="navQ(-1)">← Anterior</button>
    <button class="nav-btn primary" id="next-btn" ${state.answers[state.cur] === null ? 'disabled' : ''} onclick="navQ(1)">
      ${isLast ? 'Finalizar evaluación →' : 'Siguiente →'}
    </button>
  </div>`;

  body.innerHTML = html;

  // Start timer if needed
  if (q.timed && !state.revealed[state.cur] && q.type !== 'memory') {
    startTimer(q.timeLimit, () => {
      if (!state.revealed[state.cur]) {
        if (state.answers[state.cur] === null) state.answers[state.cur] = -1;
        state.revealed[state.cur] = true;
        renderQuiz(body);
      }
    });
  }
}

function renderMemoryInner(q) {
  if (state.revealed[state.cur]) {
    // Phase 2 — question
    let html = `<p style="font-size:13px;color:var(--gray-400);margin-bottom:1rem">Los datos del caso ya no están visibles.</p>
      <p class="q-text">${q.subQ}</p><div class="options">`;
    q.opts.forEach((o, i) => {
      const ok = i === q.correct;
      const bad = state.answers[state.cur] === i && !ok;
      let cls = 'opt-btn' + (ok ? ' correct' : bad ? ' wrong' : ' neutral-reveal');
      html += `<button class="${cls}"><span class="opt-letter">${LETTERS[i]}</span><span>${o}</span></button>`;
    });
    html += '</div>';
    const isOk = state.answers[state.cur] === q.correct;
    html += `<div class="feedback-box ${isOk ? 'feedback-ok' : 'feedback-bad'}">${isOk ? '✓ Correcto — ' : '✗ Respuesta correcta: A — '}<em>${q.feedback}</em></div>`;
    return html;
  }

  if (state.memPhase === 0) {
    // Phase 1 — show data
    let html = `<p class="q-text">${q.q}</p><div class="mem-grid">`;
    q.memData.forEach(d => {
      html += `<div class="mem-item"><strong>${d.label}</strong><span>${d.val}</span></div>`;
    });
    html += `</div><p class="hint">Los datos desaparecerán cuando el temporizador llegue a cero.</p>`;
    startTimer(q.timeLimit, () => {
      state.memPhase = 1;
      renderMemPhase2(q);
    });
    return html;
  } else {
    renderMemPhase2(q);
    return '';
  }
}

function renderMemPhase2(q) {
  clearTimer();
  const body = document.getElementById('main-body');
  const rev = state.revealed[state.cur];
  let html = `<div class="q-card"><div class="q-card-body">
    <p style="font-size:13px;color:var(--gray-400);margin-bottom:1rem">Los datos del caso ya no están visibles.</p>
    <p class="q-text">${q.subQ}</p><div class="options">`;
  q.opts.forEach((o, i) => {
    let cls = 'opt-btn';
    if (rev) {
      cls += i === q.correct ? ' correct' : state.answers[state.cur] === i ? ' wrong' : ' neutral-reveal';
    }
    const click = rev ? '' : `onclick="selectMemory(${i})"`;
    html += `<button class="${cls}" ${click}><span class="opt-letter">${LETTERS[i]}</span><span>${o}</span></button>`;
  });
  html += '</div>';
  if (rev) {
    const isOk = state.answers[state.cur] === q.correct;
    html += `<div class="feedback-box ${isOk ? 'feedback-ok' : 'feedback-bad'}">${isOk ? '✓ Correcto — ' : '✗ Respuesta correcta: A — '}<em>${q.feedback}</em></div>`;
  }
  html += `</div></div><div class="nav-row">
    <button class="nav-btn" ${state.cur === 0 ? 'disabled' : ''} onclick="navQ(-1)">← Anterior</button>
    <button class="nav-btn primary" ${state.answers[state.cur] === null ? 'disabled' : ''} onclick="navQ(1)">
      ${state.cur === QUESTIONS.length - 1 ? 'Finalizar evaluación →' : 'Siguiente →'}
    </button>
  </div>`;
  body.innerHTML = html;
}

function renderRankInner(q) {
  if (!state.rankOrder.length) state.rankOrder = q.tasks.map(t => t.id);
  let html = `<p class="q-text">${q.q}</p>
    <p class="hint" style="margin-bottom:.75rem">Toca una tarea para seleccionarla, luego toca otra para intercambiar su posición. Ordena de mayor a menor prioridad.</p>`;
  state.rankOrder.forEach((id, idx) => {
    const t = q.tasks.find(x => x.id === id);
    const isSel = state.rankSelected === id;
    const cls = 'rank-item' + (isSel ? ' selected-rank' : '');
    const click = state.revealed[state.cur] ? '' : `onclick="rankClick('${id}')"`;
    html += `<div class="${cls}" ${click}><span class="rank-num">${idx + 1}</span><span>${t.text}</span></div>`;
  });
  if (!state.revealed[state.cur]) {
    html += `<button class="nav-btn primary" style="margin-top:.75rem" onclick="confirmRank()">Confirmar orden</button>`;
  } else {
    const fb = scoreRank(state.cur) ? 'feedback-ok' : 'feedback-bad';
    const ok = scoreRank(state.cur);
    html += `<div class="feedback-box ${fb}">${ok ? '✓ Buena priorización — ' : '✗ Orden recomendado: 1) Documentar llamada urgente, 2) Paciente en espera, 3) Cuidadora laboratorios, 4) Reporte al líder — '}<em>${q.feedback}</em></div>`;
  }
  return html;
}

// ─── Interactions ─────────────────────────────────────────────────────────────
function selectMCQ(i) {
  if (state.revealed[state.cur]) return;
  clearTimer();
  state.answers[state.cur] = i;
  state.revealed[state.cur] = true;
  renderQuiz(document.getElementById('main-body'));
}

function selectMemory(i) {
  if (state.revealed[state.cur]) return;
  state.answers[state.cur] = i;
  state.revealed[state.cur] = true;
  renderMemPhase2(QUESTIONS[state.cur]);
}

function rankClick(id) {
  if (state.rankSelected === null) {
    state.rankSelected = id;
  } else {
    if (state.rankSelected !== id) {
      const a = state.rankOrder.indexOf(state.rankSelected);
      const b = state.rankOrder.indexOf(id);
      [state.rankOrder[a], state.rankOrder[b]] = [state.rankOrder[b], state.rankOrder[a]];
    }
    state.rankSelected = null;
  }
  renderQuiz(document.getElementById('main-body'));
}

function confirmRank() {
  state.answers[state.cur] = JSON.stringify(state.rankOrder);
  state.revealed[state.cur] = true;
  state.rankSelected = null;
  renderQuiz(document.getElementById('main-body'));
}

function navQ(dir) {
  clearTimer();
  state.rankOrder = [];
  state.rankSelected = null;
  state.memPhase = 0;
  if (dir === 1 && state.cur === QUESTIONS.length - 1) {
    submitResults();
    return;
  }
  const n = state.cur + dir;
  if (n < 0 || n >= QUESTIONS.length) return;
  state.cur = n;
  render();
}

// ─── Scoring ──────────────────────────────────────────────────────────────────
function scoreRank(idx) {
  const q = QUESTIONS[idx];
  if (!state.answers[idx]) return 0;
  try {
    const u = JSON.parse(state.answers[idx]);
    let pts = 0;
    u.forEach((id, i) => { if (id === q.correctRank[i]) pts++; });
    return pts >= 3 ? 1 : 0;
  } catch (e) { return 0; }
}

function calcScores() {
  const mods = {emp:{s:0,t:0}, cx:{s:0,t:0}, mem:{s:0,t:0}, ag:{s:0,t:0}, mt:{s:0,t:0}};
  let total = 0;
  QUESTIONS.forEach((q, i) => {
    mods[q.module].t++;
    const ok = q.type === 'rank' ? scoreRank(i) : (state.answers[i] === q.correct ? 1 : 0);
    mods[q.module].s += ok;
    total += ok;
  });
  return { total, mods, pct: Math.round(total / QUESTIONS.length * 100) };
}

function getProfile(pct) {
  if (pct >= 75) return 'Apto para atención en salud';
  if (pct >= 50) return 'En desarrollo — requiere acompañamiento';
  return 'Requiere formación previa al rol';
}

// ─── Submit ───────────────────────────────────────────────────────────────────
function renderSubmitting(body) {
  body.innerHTML = `<div class="submitting-overlay">
    <div class="spinner"></div>
    <div class="submit-msg">Enviando resultados...</div>
    <div class="submit-sub">Por favor no cierres esta ventana.</div>
  </div>`;
}

function renderDone(body) {
  body.innerHTML = `<div class="done-card">
    <div class="done-icon">✓</div>
    <div class="done-title">Evaluación completada</div>
    <div class="done-sub">Gracias por completar la evaluación. Los resultados han sido enviados al equipo de Vama Solutions.</div>
  </div>`;
}

async function submitResults() {
  state.view = 'submitting';
  render();

  const scores = calcScores();
  const profile = getProfile(scores.pct);

  // Build detailed answers text
  let detail = '';
  QUESTIONS.forEach((q, i) => {
    const ans = state.answers[i];
    let ansText = '';
    if (q.type === 'rank') {
      try { ansText = 'Orden: ' + JSON.parse(ans).join(' → '); } catch(e) { ansText = 'Sin responder'; }
    } else if (ans === null || ans === -1) {
      ansText = 'Sin responder (tiempo agotado)';
    } else {
      ansText = LETTERS[ans] + ') ' + q.opts[ans];
    }
    const ok = q.type === 'rank' ? scoreRank(i) : (ans === q.correct ? 1 : 0);
    detail += `${i+1}. [${q.label}] ${q.q.substring(0,60)}...\nRespuesta: ${ansText}\nResultado: ${ok ? 'CORRECTO' : 'INCORRECTO'}\n\n`;
  });

  const templateParams = {
    candidate_name:  state.candidate.name,
    candidate_id:    state.candidate.id,
    candidate_role:  state.candidate.role,
    candidate_date:  state.candidate.date,
    score_total:     `${scores.total}/${QUESTIONS.length} (${scores.pct}%)`,
    score_emp:       `${scores.mods.emp.s}/${scores.mods.emp.t}`,
    score_cx:        `${scores.mods.cx.s}/${scores.mods.cx.t}`,
    score_mem:       `${scores.mods.mem.s}/${scores.mods.mem.t}`,
    score_ag:        `${scores.mods.ag.s}/${scores.mods.ag.t}`,
    score_mt:        `${scores.mods.mt.s}/${scores.mods.mt.t}`,
    profile_label:   profile,
    answers_detail:  detail
  };

  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
  } catch(err) {
    console.error('EmailJS error:', err);
    // Still show done screen even if email fails silently
  }

  state.view = 'done';
  render();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
